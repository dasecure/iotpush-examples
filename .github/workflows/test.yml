name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Test on the oldest versions the examples claim to support.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install jq
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - name: Run examples against the local mock API
        run: bash tests/run.sh
